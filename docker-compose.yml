version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ain-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - ain-network

  omniai-engine:
    build: .
    container_name: omniai-engine
    restart: unless-stopped
    ports:
      - "3003:3003"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./.env:/usr/src/app/.env:ro
      - ./oauth2.tokens.json:/usr/src/app/oauth2.tokens.json
      - ./oauth2.tokens.channel2.json:/usr/src/app/oauth2.tokens.channel2.json
      - ./content:/usr/src/app/content
      - ./src:/usr/src/app/src
    environment:
      - NODE_ENV=production
      - TZ=America/Bogota
      - REDIS_HOST=ain-redis
    networks:
      - ain-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
    driver: local

networks:
  ain-network:
    external: true
    name: autonomous-income-node_ain-network

